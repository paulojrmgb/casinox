  <script src="app.js?v=1.3"></script>
  <script src="CasinoX_v0.4_conta.js?v=1.3"></script>

<script>

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register("./sw.js")
        .then(
          registration => {

            console.log(
              "CasinoX PWA ativa:",
              registration.scope
            );

          }
        )
        .catch(
          error => {

            console.error(
              "Erro ao registrar PWA:",
              error
            );

          }
        );

    }
  );

}

</script>
  

<script>
(function () {
  if (!("serviceWorker" in navigator)) return;

  navigator.serviceWorker.addEventListener("message", function (event) {
    if (!event.data || event.data.type !== "CASINOX_UPDATED") return;

    if (sessionStorage.getItem("casinox_sw_reloaded") === "1.0") return;

    sessionStorage.setItem("casinox_sw_reloaded", "1.0");

    setTimeout(function () {
      window.location.reload();
    }, 250);
  });

  navigator.serviceWorker.ready.then(function (registration) {
    registration.update().catch(function () {});
  });
})();
</script>

</body>
